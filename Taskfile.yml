# https://taskfile.dev

version: '3'

tasks:
  fmt:
    desc: Format Go source code
    cmds:
      - go fmt ./...
      - go fix ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Run fmt, vet, lint, and test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  docs:build:
    desc: Build documentation (markdown to HTML)
    cmds:
      - task-plus md2html --file index.md --dst docs

  clean:
    desc: Remove generated files
    cmds:
      - rm -rf docs/*.html
